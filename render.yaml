services:
  - type: web
    name: rag-app
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: LLM_BACKEND
        value: gemini
      - key: UPLOAD_FOLDER
        value: uploads
